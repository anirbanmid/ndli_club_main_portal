# Python tooling configuration for the backend (pytest, ruff, mypy, coverage).
# No build system here: dependencies are installed from requirements*.txt.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
# Django convention names per-app test modules tests.py; pytest's default
# pattern is test_*.py, so widen it to collect them.
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["apps"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Settings modules use star imports by Django convention.
"config/settings/*" = ["F403", "F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
exclude = ["migrations/"]

[tool.coverage.run]
source = ["apps", "config"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
