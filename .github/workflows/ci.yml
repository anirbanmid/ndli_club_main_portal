# CI for the NDLI Club Main Portal monorepo.
# Jobs: lint, typecheck, tests (Postgres service), dependency audit, SAST,
# frontend build + axe accessibility check. Parts of this pipeline exercise
# stack components (docker, MinIO, Redis) that only exist in the compose stack;
# every job here is designed to run on GitHub-hosted runners as-is.
#
# DEPLOY ARRANGEMENT (2026-10-23): production deploys are triggered by Render
# itself — service -> Settings -> Build & Deploy -> Auto Deploy = "After CI
# Checks Pass". This workflow runs on EVERY push to main (no path filters), so
# Render always has checks to wait for.
#
# Do NOT re-add a deploy-hook workflow alongside it. One was removed because it
# fired the Render Deploy Hook after CI while Render's own post-CI trigger
# also fired, deploying every commit TWICE; and Render's trigger alone already
# guarantees a red CI run never reaches production. If you ever need the hook
# again (e.g. Render's setting is lost), delete Render's auto-deploy FIRST, or
# you are back to duplicate deploys.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff
        run: ruff check backend
        # ruff discovers backend/pyproject.toml per-file, no cd needed.

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Mypy
        working-directory: backend
        run: mypy .

  tests:
    name: Tests (pytest + Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ndli_club_test
          POSTGRES_USER: ndli_club
          POSTGRES_PASSWORD: ndli_club_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ndli_club -d ndli_club_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: postgresql://ndli_club:ndli_club_ci_password@localhost:5432/ndli_club_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Django system check
        run: python backend/manage.py check
      - name: Pytest
        working-directory: backend
        run: python -m pytest

  dependency-audit:
    name: Dependency audit (pip-audit + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high --package-lock-only

  sast:
    name: SAST (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bandit
        run: python -m pip install --upgrade pip bandit
      - name: Bandit
        run: bandit -r backend -x backend/.venv --severity-level medium

  frontend:
    name: Frontend build + axe accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint (oxlint)
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install synced Chrome + ChromeDriver (pinned)
        run: |
          npx --yes browser-driver-manager install chrome@155.0.8059.84
          echo "CHROME_PATH=$HOME/.browser-driver-manager/chrome/linux-155.0.8059.84/chrome-linux64/chrome" >> "$GITHUB_ENV"
          echo "AXE_CHROMEDRIVER=$HOME/.browser-driver-manager/chromedriver/linux-155.0.8059.84/chromedriver-linux64/chromedriver" >> "$GITHUB_ENV"
      - name: Serve build and run axe accessibility check
        working-directory: frontend
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 --strictPort &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then break; fi
            if [ "$i" = 30 ]; then echo "preview server never came up"; exit 1; fi
            sleep 1
          done
          npx --yes @axe-core/cli@4.10.2 http://127.0.0.1:4173/ \
            --exit --chrome-options="--no-sandbox" \
            --chromedriver-path="$AXE_CHROMEDRIVER"

  e2e:
    name: E2E + axe (Playwright, V8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E + axe (verifier/directory/telemetry)
        working-directory: frontend
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  lighthouse:
    name: Lighthouse (a11y hard gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Lighthouse CI (lighthouserc.json assertions)
        working-directory: frontend
        run: npx lhci autorun
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci/
          retention-days: 7
