# Python tooling configuration for the backend (pytest, ruff, mypy, coverage).
# No build system here: dependencies are installed from requirements*.txt.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
# Django convention names per-app test modules tests.py; pytest's default
# pattern is test_*.py, so widen it to collect them.
python_files = ["test_*.py", "*_test.py", "tests.py"]
# apps = per-app smoke tests; tests = the M1 named adversarial pins (T1-T7).
testpaths = ["apps", "tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["."]
extend-exclude = [".venv", "**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
# Settings modules use star imports by Django convention.
"config/settings/*" = ["F403", "F401"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
check_untyped_defs = true
# django-stubs makes mypy understand Django's field descriptors, managers and
# TextChoices, so model declarations type-check without 60+ false positives.
# NOTE: django-stubs >= 6 renamed the plugin entry point to
# mypy_django_plugin.main (it was mypy_django.main before).
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# tests.support is an M1 PIN file (byte-identical to the M1 kit) and must stay
# untouched: its Profile.objects.create(...) passes the M2 FK-swap compat
# *property* kwargs (institution_code/club_code/state_code/zone_code), which
# django-stubs cannot type-check (it only knows model fields). Suppress the
# false-positive code HERE instead of annotating the pin file. Runtime
# semantics are pinned by the M1/M2 suites.
module = "tests.support"
disable_error_code = ["misc"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"

[tool.coverage.run]
source = ["apps", "config"]
branch = true

[tool.coverage.report]
fail_under = 0
show_missing = true
