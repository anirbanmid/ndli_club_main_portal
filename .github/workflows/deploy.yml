# Render deploy trigger for the NDLI Club Main Portal.
# Runs ONLY after the CI workflow finishes GREEN on main -> calls the Render
# Deploy Hook (free on all Render plans) -> Render rebuilds and redeploys.
#
# Strictly better than plain Auto-Deploy: a red CI run can never reach the
# live site, because the hook is only called on workflow_run success.
#
# SECURITY: the Deploy Hook URL contains a secret key. It lives ONLY in the
# GitHub repo secret RENDER_DEPLOY_HOOK (Settings -> Secrets and variables ->
# Actions). NEVER commit it, NEVER paste it in chat/logs. If it leaks,
# regenerate it in Render -> service -> Settings -> Deploy Hook.
#
# Placement: .github/workflows/deploy.yml (sibling of ci.yml).
# ci.yml stays byte-identical — this is a separate workflow file.
#
# REQUIRED DASHBOARD SETTING: Render -> service -> Settings -> Build & Deploy
# -> Auto Deploy must be OFF. With Auto-Deploy ON, Render also deploys on every
# push WITHOUT waiting for CI, so each commit deploys twice and a red CI run
# still reaches production — defeating the workflow_run gate below.

name: Deploy (Render)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deploy (only if CI green)
    runs-on: ubuntu-latest
    # Deploy only when the CI run succeeded — never on red or cancelled runs.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Check deploy hook secret is configured
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK secret is not set. Add it in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          # Do not echo the URL (it carries the secret key). GitHub Actions
          # masks the secret, but printing the URL is still needless exposure.
          http_code=$(curl -sS -o hook_response.json -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK")
          echo "Deploy hook HTTP status: $http_code"
          cat hook_response.json
          case "$http_code" in
            2??) echo "Deploy triggered successfully." ;;
            *)   echo "::error::Deploy hook call failed (HTTP $http_code)"; exit 1 ;;
          esac
